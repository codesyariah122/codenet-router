openapi: 3.1.0
info:
  title: CODENET Management API
  version: 0.2.0
  description: API monitoring Linux read-only dengan autentikasi administrator untuk CODENET Router OS.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Development lokal
tags:
  - name: Authentication
  - name: Dashboard
  - name: System
  - name: Interfaces
  - name: IP
  - name: PPPoE
  - name: Bandwidth
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login administrator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 1024, format: password }
      responses:
        '200':
          description: Login berhasil dan cookie session HttpOnly dibuat
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Batas percobaan login terlampaui
  /auth/session:
    get:
      tags: [Authentication]
      summary: Membaca session administrator aktif
      responses:
        '200':
          description: Session aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Membatalkan session administrator
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Token CSRF tidak valid
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Mengambil data agregat dashboard
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
  /system/info:
    get:
      tags: [System]
      summary: Mengambil informasi sistem
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfoResponse' }
  /system/resources:
    get:
      tags: [System]
      summary: Mengambil penggunaan CPU dan memori
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /system/services:
    get:
      tags: [System]
      summary: Mengambil status layanan inti
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /interfaces:
    get:
      tags: [Interfaces]
      summary: Mengambil seluruh interface
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/NetworkInterface' } }
  /interfaces/{name}:
    get:
      tags: [Interfaces]
      summary: Mengambil satu interface
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_.:-]+$' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ip/addresses:
    get:
      tags: [IP]
      summary: Mengambil alamat IPv4 dan IPv6 dari kernel
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/IPAddress' } }
  /ip/routes:
    get:
      tags: [IP]
      summary: Mengambil routing table IPv4 dan IPv6
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Route' } }
  /pppoe/status:
    get:
      tags: [PPPoE]
      summary: Mengambil status Accel-PPP
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /pppoe/sessions:
    get:
      tags: [PPPoE]
      summary: Mengambil sesi PPPoE tanpa data password
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /bandwidth/profiles:
    get:
      tags: [Bandwidth]
      summary: Mengambil profil bandwidth
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /bandwidth/statistics:
    get:
      tags: [Bandwidth]
      summary: Mengambil statistik limiter
      responses:
        '200': { $ref: '#/components/responses/Success' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: codenet_session
  responses:
    Success:
      description: Berhasil
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Autentikasi diperlukan atau session berakhir
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
    ErrorEnvelope:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        error:
          type: object
          required: [code]
          properties: { code: { type: string } }
    SystemInfo:
      type: object
      required: [hostname, os, version, kernel, uptime_seconds]
      properties:
        hostname: { type: string }
        os: { type: string }
        version: { type: string }
        kernel: { type: string }
        uptime_seconds: { type: integer, format: int64, minimum: 0 }
    ResourceUsage:
      type: object
      required: [cpu_percent, memory_percent, memory_used_bytes, memory_total_bytes]
      properties:
        cpu_percent: { type: number, minimum: 0, maximum: 100 }
        memory_percent: { type: number, minimum: 0, maximum: 100 }
        memory_used_bytes: { type: integer, format: int64, minimum: 0 }
        memory_total_bytes: { type: integer, format: int64, minimum: 0 }
    NetworkInterface:
      type: object
      required: [name, role, type, mac_address, ipv4_addresses, status, mtu, rx_bytes, tx_bytes, rx_packets, tx_packets]
      properties:
        name: { type: string }
        role: { type: string }
        type: { type: string }
        mac_address: { type: string }
        ipv4_addresses: { type: array, items: { type: string } }
        status: { type: string, enum: [up, down, unknown] }
        mtu: { type: integer }
        rx_bytes: { type: integer, format: int64 }
        tx_bytes: { type: integer, format: int64 }
        rx_packets: { type: integer, format: int64 }
        tx_packets: { type: integer, format: int64 }
    IPAddress:
      type: object
      required: [address, network, interface, ip_version, scope, flags]
      properties:
        address: { type: string }
        network: { type: string }
        interface: { type: string }
        ip_version: { type: integer, enum: [4, 6] }
        scope: { type: string }
        flags: { type: array, items: { type: string } }
    Route:
      type: object
      required: [destination, metric, protocol, routing_table, ip_version, route_type, status]
      properties:
        destination: { type: string }
        gateway: { type: string }
        interface: { type: string }
        metric: { type: integer, format: int64, minimum: 0 }
        protocol: { type: string }
        scope: { type: string }
        routing_table: { type: string }
        ip_version: { type: integer, enum: [4, 6] }
        route_type: { type: string }
        status: { type: string }
    PPPoEStatus:
      type: object
      required: [service_name, access_concentrator, status, active_sessions, ip_pool]
      properties:
        service_name: { type: string }
        access_concentrator: { type: string }
        status: { type: string }
        active_sessions: { type: integer, minimum: 0 }
        ip_pool: { type: string }
    TrafficPoint:
      type: object
      required: [timestamp, rx_bps, tx_bps]
      properties:
        timestamp: { type: string, format: date-time }
        rx_bps: { type: integer, format: int64 }
        tx_bps: { type: integer, format: int64 }
    DashboardData:
      type: object
      required: [system, resources, interfaces, pppoe, traffic_history]
      properties:
        system: { $ref: '#/components/schemas/SystemInfo' }
        resources: { $ref: '#/components/schemas/ResourceUsage' }
        interfaces: { type: array, items: { $ref: '#/components/schemas/NetworkInterface' } }
        pppoe: { $ref: '#/components/schemas/PPPoEStatus' }
        traffic_history: { type: array, items: { $ref: '#/components/schemas/TrafficPoint' } }
    DashboardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/DashboardData' } }
    SystemInfoResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/SystemInfo' } }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [admin, csrf_token, expires_at]
              properties:
                admin:
                  type: object
                  required: [username]
                  properties: { username: { type: string } }
                csrf_token: { type: string }
                expires_at: { type: string, format: date-time }
security:
  - cookieAuth: []
